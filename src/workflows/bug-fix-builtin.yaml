id: bug_fix_builtin
name: Bug Fix (Built-in)
description: "Lightweight fix workflow: requirements analysis, code fix, and review. Use for targeted bug fixes without architectural changes. The fix passes only if the validation gate exits 0 (ADR-001). Step graph routes on emitted signals (ADR-011)."

steps:
  - id: spec
    agent: requirement_analyst
    any: ["__start__", "review_spec.sig_fail"]
    task: "Analyze requirements"
    emits:
      - name: sig_done
        description: "Spec is complete"

  - id: review_spec
    agent: review
    on: ["spec.sig_done"]
    task: "Review requirements spec"
    emits:
      - name: sig_pass
        description: "Bug description is clear and reproduction steps are accurate"
      - name: sig_fail
        description: "Bug description is unclear — spec must re-run with this feedback"

  - id: code
    agent: code_generation_backend
    any: ["review_spec.sig_pass", "validate.sig_fail", "review_code.sig_fail"]
    task: "Generate code"
    emits:
      - name: sig_done
        description: "Code fix is complete"

  - id: validate
    type: script
    on: ["code.sig_done"]
    run: 'cmd "validate"'
    emits:
      - name: sig_pass
        description: "Fix passes validation (exit 0)"
      - name: sig_fail
        description: "Fix still broken (non-zero exit) — code must re-run with the gate output"

  - id: review_code
    agent: review
    on: ["validate.sig_pass"]
    task: "Review code changes"
    context: [code, validate]
    emits:
      - name: sig_pass
        description: "Fix is correct and introduces no regressions"
      - name: sig_fail
        description: "Issues remain — code must re-run with this feedback"

completion: "Bug fixed"
