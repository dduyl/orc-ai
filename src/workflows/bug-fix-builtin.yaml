id: bug_fix_builtin
name: Bug Fix (Built-in)
description: "Lightweight fix workflow: requirements analysis, code fix, and review. Use for targeted bug fixes without architectural changes. The fix passes only if the validation gate exits 0 (ADR-001)."

steps:
  - id: spec
    agent: requirement_analyst
    needs: []
    task: "Analyze requirements"

  - id: review_spec
    agent: review
    needs: [spec]
    task: "Review requirements spec"
    signal:
      name: spec_ok
      description: "True if bug description is clear and reproduction steps are accurate, false if unclear"
      on: null
      off: spec

  - id: code
    agent: code_generation_backend
    needs: [review_spec]
    task: "Generate code"

  - id: validate
    type: script
    needs: [code]
    run: 'cmd "validate"'
    signal:
      name: fix_ok
      description: "True if the fix passes validation (exit 0), false if still broken"
      on: null
      off: code

  - id: review_code
    agent: review
    needs: [validate]
    task: "Review code changes"
    context: [code, validate]
    signal:
      name: fix_review_ok
      description: "True if the fix is correct and introduces no regressions, false if issues remain"
      on: null
      off: code

completion: "Bug fixed"